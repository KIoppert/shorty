apiVersion: v1
kind: ConfigMap
metadata:
  name: vmalert-rules
data:
  shorty.yaml: |
    groups:
      - name: shorty
        type: vlogs
        interval: 1m
        rules:
          - alert: ShortyErrors
            expr: 'level:error | stats by ("service.name") count() as errors | filter errors:>0'
            annotations:
              summary: '{{ index $labels "service.name" }}: {{ $value }} ошибок за последнюю минуту'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmalert
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vmalert
  template:
    metadata:
      labels:
        app: vmalert
    spec:
      containers:
        - name: vmalert
          image: victoriametrics/vmalert:v1.154.0
          args:
            - -datasource.url=http://victorialogs:9428
            - -rule=/etc/vmalert/*.yaml
            - -notifier.blackhole
          ports:
            - containerPort: 8880
          volumeMounts:
            - name: rules
              mountPath: /etc/vmalert
      volumes:
        - name: rules
          configMap:
            name: vmalert-rules
---
apiVersion: v1
kind: Service
metadata:
  name: vmalert
spec:
  selector:
    app: vmalert
  ports:
    - port: 8880
