apiVersion: v1
kind: ServiceAccount
metadata:
  name: vector
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vector
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vector
subjects:
  - kind: ServiceAccount
    name: vector
    namespace: default
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-config
data:
  vector.yaml: |
    data_dir: /vector-data-dir

    sources:
      pods:
        type: kubernetes_logs
        extra_field_selector: metadata.namespace=default
        extra_label_selector: app notin (vector,victorialogs,vmalert)
        glob_minimum_cooldown_ms: 5000

    transforms:
      app:
        type: remap
        inputs: [pods]
        source: |
          parsed, err = parse_json(.message)
          if err == null && is_object(parsed) {
            . = merge(., object!(parsed))
          } else {
            ."service.name" = "shorty-" + string!(.kubernetes.container_name)
            .level = if match(string!(.message), r'(?i)\b(error|fatal|panic)\b') { "error" } else { "info" }
          }
          .pod = .kubernetes.pod_name
          .container = .kubernetes.container_name
          .node = .kubernetes.pod_node_name
          del(.kubernetes)
          del(.file)
          del(.source_type)
          del(.stream)

    sinks:
      victorialogs:
        type: elasticsearch
        inputs: [app]
        endpoints: [http://victorialogs:9428/insert/elasticsearch/]
        api_version: v8
        compression: gzip
        healthcheck:
          enabled: false
        query:
          _msg_field: message
          _time_field: timestamp
          _stream_fields: service.name,pod
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vector
spec:
  selector:
    matchLabels:
      app: vector
  template:
    metadata:
      labels:
        app: vector
    spec:
      serviceAccountName: vector
      containers:
        - name: vector
          image: timberio/vector:0.59.0-alpine
          args: ["--config-dir", "/etc/vector/"]
          env:
            - name: VECTOR_SELF_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: config
              mountPath: /etc/vector
              readOnly: true
            - name: var-log
              mountPath: /var/log
              readOnly: true
            - name: var-lib
              mountPath: /var/lib
              readOnly: true
            - name: data
              mountPath: /vector-data-dir
      volumes:
        - name: config
          configMap:
            name: vector-config
        - name: var-log
          hostPath:
            path: /var/log
        - name: var-lib
          hostPath:
            path: /var/lib
        - name: data
          hostPath:
            path: /var/lib/vector
            type: DirectoryOrCreate
