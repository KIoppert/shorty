apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-config
  namespace: monitoring
stringData:
  alertmanager.yaml: |
    route:
      receiver: telegram
      group_by: [alertname]
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 1h
    receivers:
      - name: telegram
        telegram_configs:
          - bot_token: "ВСТАВЬТЕ_ТОКЕН_БОТА"
            chat_id: 123456789
            parse_mode: HTML
            send_resolved: true
            message: |-
              {{ range .Alerts }}{{ if eq .Status "firing" }}🔥{{ else }}✅{{ end }} <b>{{ .Labels.alertname }}</b> [{{ .Labels.severity }}]
              {{ .Annotations.summary }}
              {{ .Annotations.description }}
              {{ end }}
