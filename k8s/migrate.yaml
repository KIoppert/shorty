apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: shorty-api:dev
          args: ["migrate"]
          envFrom:
            - configMapRef:
                name: shorty-config
            - secretRef:
                name: shorty-secret
