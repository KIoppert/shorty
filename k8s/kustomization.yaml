apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: shorty

resources:
  - namespace.yaml
  - postgres.yaml
  - migrate.yaml
  - api.yaml
  - web.yaml

configMapGenerator:
  - name: shorty-config
    envs:
      - config.env

secretGenerator:
  - name: shorty-secret
    envs:
      - secret.env

images:
  - name: shorty-api
    newTag: dev
  - name: shorty-web
    newTag: dev

labels:
  - pairs:
      app.kubernetes.io/part-of: shorty
