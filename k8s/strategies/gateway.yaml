apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: shorty-rollouts
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: shorty-rollouts
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: shorty-rollouts
    namespace: envoy-gateway-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shorty-rollouts
  namespace: shorty-rollouts
spec:
  gatewayClassName: shorty-rollouts
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: shorty-rollouts.localhost
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shorty-web
  namespace: shorty-rollouts
spec:
  parentRefs:
    - name: shorty-rollouts
  hostnames: [shorty-rollouts.localhost]
  rules:
    - matches:
        - path:
            type: Exact
            value: /
        - path:
            type: PathPrefix
            value: /assets
      backendRefs:
        - name: web
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shorty-api
  namespace: shorty-rollouts
spec:
  parentRefs:
    - name: shorty-rollouts
  hostnames: [shorty-rollouts.localhost]
  rules:
    - backendRefs:
        - name: api
          port: 8080
